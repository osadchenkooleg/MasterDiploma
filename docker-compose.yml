version: "3.9"
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: ch-server
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_DB=codebase
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=1234
    volumes:
      - ./clickhouse/data:/var/lib/clickhouse
      - ./clickhouse/logs:/var/log/clickhouse-server
      - ./:/var/lib/clickhouse/user_files/workspace:ro      # <— host project root visible at /workspace in the container
      # Optional: custom config dir if you add files later
      # - ./clickhouse/config:/etc/clickhouse-server/config.d
      # - ./clickhouse/users:/etc/clickhouse-server/users.d
